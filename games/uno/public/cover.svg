<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="UNO cover art">
  <defs>
    <radialGradient id="burst" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#ff6a3d"/>
      <stop offset="48%" stop-color="#ef2b31"/>
      <stop offset="100%" stop-color="#8e0c1c"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>
    <g id="ray">
      <path d="M320 208 L300 -120 L340 -120 Z" fill="#ffce4a"/>
    </g>
    <g id="cardback-red">
      <rect x="-46" y="-70" width="92" height="140" rx="12" fill="#ffffff"/>
      <rect x="-41" y="-65" width="82" height="130" rx="9" fill="#e8262a"/>
      <ellipse cx="0" cy="0" rx="52" ry="30" fill="#ffffff" transform="rotate(-28)"/>
      <g transform="rotate(-28)">
        <circle cx="0" cy="0" r="19" fill="#e8262a"/>
        <circle cx="0" cy="0" r="19" fill="none" stroke="#e8262a" stroke-width="7"/>
        <path d="M-13 13 L13 -13" stroke="#e8262a" stroke-width="7" stroke-linecap="round"/>
      </g>
      <rect x="-46" y="-70" width="92" height="140" rx="12" fill="url(#gloss)"/>
    </g>
    <g id="cardface">
      <rect x="-46" y="-70" width="92" height="140" rx="12" fill="#ffffff"/>
      <rect x="-41" y="-65" width="82" height="130" rx="9" fill="var(--card)"/>
      <ellipse cx="0" cy="0" rx="52" ry="30" fill="#ffffff" transform="rotate(-28)"/>
      <text x="0" y="4" text-anchor="middle" dominant-baseline="middle" font-family="Arial Black, Arial, sans-serif" font-size="58" font-weight="900" fill="var(--card)">7</text>
      <rect x="-46" y="-70" width="92" height="140" rx="12" fill="url(#gloss)"/>
    </g>
  </defs>

  <rect width="640" height="480" fill="url(#burst)"/>
  <g opacity="0.16">
    <use href="#ray" transform="rotate(0 320 208)"/>
    <use href="#ray" transform="rotate(30 320 208)"/>
    <use href="#ray" transform="rotate(60 320 208)"/>
    <use href="#ray" transform="rotate(90 320 208)"/>
    <use href="#ray" transform="rotate(120 320 208)"/>
    <use href="#ray" transform="rotate(150 320 208)"/>
    <use href="#ray" transform="rotate(180 320 208)"/>
    <use href="#ray" transform="rotate(210 320 208)"/>
    <use href="#ray" transform="rotate(240 320 208)"/>
    <use href="#ray" transform="rotate(270 320 208)"/>
    <use href="#ray" transform="rotate(300 320 208)"/>
    <use href="#ray" transform="rotate(330 320 208)"/>
  </g>

  <!-- fanned hand behind the logo -->
  <g transform="translate(150 348) rotate(-24)"><use href="#cardback-red" transform="scale(0.72)"/></g>
  <g transform="translate(206 320) rotate(-12)">
    <g transform="scale(0.72)" style="--card:#1c62d1"><use href="#cardface"/></g>
  </g>
  <g transform="translate(268 302) rotate(0)">
    <g transform="scale(0.72)" style="--card:#17923a"><use href="#cardface"/></g>
  </g>
  <g transform="translate(330 300) rotate(10)">
    <g transform="scale(0.72)" style="--card:#f5c400"><use href="#cardface"/></g>
  </g>
  <g transform="translate(394 314) rotate(21)">
    <g transform="scale(0.72)" style="--card:#e8262a"><use href="#cardface"/></g>
  </g>
  <g transform="translate(452 344) rotate(30)"><use href="#cardback-red" transform="scale(0.72)"/></g>

  <!-- tilted logo plate -->
  <g transform="translate(320 150) rotate(-7)">
    <rect x="-132" y="-64" width="264" height="128" rx="30" fill="#c81422" stroke="#ffffff" stroke-width="9"/>
    <text x="0" y="8" text-anchor="middle" dominant-baseline="middle" font-family="Arial Black, Arial, sans-serif" font-size="96" font-weight="900" fill="#ffce4a" stroke="#7c0713" stroke-width="3" letter-spacing="2">UNO</text>
  </g>
  <g transform="translate(320 236)">
    <rect x="-104" y="-21" width="208" height="42" rx="21" fill="#131118" opacity="0.72"/>
    <text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffdf7e" letter-spacing="6">CARD CLASSICS</text>
  </g>
</svg>
