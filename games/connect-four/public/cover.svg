<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-label="Connect Four cover art">
  <defs>
    <radialGradient id="arena" cx="50%" cy="-12%" r="105%">
      <stop offset="0%" stop-color="#1d4269"/>
      <stop offset="52%" stop-color="#0d2038"/>
      <stop offset="100%" stop-color="#070d18"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a8ed3"/>
      <stop offset="100%" stop-color="#0f3f66"/>
    </linearGradient>
    <radialGradient id="red" cx="34%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#ff9d92"/>
      <stop offset="52%" stop-color="#f0473f"/>
      <stop offset="100%" stop-color="#a81a14"/>
    </radialGradient>
    <radialGradient id="yellow" cx="34%" cy="26%" r="80%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="52%" stop-color="#ffd23d"/>
      <stop offset="100%" stop-color="#cd8200"/>
    </radialGradient>
    <g id="slot">
      <circle r="23" fill="#06111f"/>
      <circle r="23" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="4"/>
    </g>
    <g id="disc-red">
      <circle r="22" fill="url(#red)"/>
      <circle r="22" fill="none" stroke="#7c110c" stroke-opacity="0.5" stroke-width="2"/>
    </g>
    <g id="disc-yellow">
      <circle r="22" fill="url(#yellow)"/>
      <circle r="22" fill="none" stroke="#8f5c00" stroke-opacity="0.5" stroke-width="2"/>
    </g>
  </defs>

  <rect width="640" height="480" fill="url(#arena)"/>

  <text x="320" y="66" text-anchor="middle" font-family="Fredoka, 'Arial Black', Arial, sans-serif" font-size="46" font-weight="600" letter-spacing="0.5" fill="#eaf3ff">Connect Four</text>

  <g transform="translate(106 96)">
    <rect width="428" height="372" rx="34" fill="url(#frame)"/>
    <rect x="6" y="6" width="416" height="360" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3"/>
    <g fill="url(#arena)">
      <!-- board holes, 7 columns x 6 rows -->
      <g transform="translate(46 46)">
        <use href="#slot"/><use href="#slot" x="56"/><use href="#slot" x="112"/><use href="#slot" x="168"/><use href="#slot" x="224"/><use href="#slot" x="280"/><use href="#slot" x="336"/>
        <use href="#slot" y="56"/><use href="#slot" x="56" y="56"/><use href="#slot" x="112" y="56"/><use href="#slot" x="168" y="56"/><use href="#slot" x="224" y="56"/><use href="#slot" x="280" y="56"/><use href="#slot" x="336" y="56"/>
        <use href="#slot" y="112"/><use href="#slot" x="56" y="112"/><use href="#slot" x="112" y="112"/><use href="#slot" x="168" y="112"/><use href="#slot" x="224" y="112"/><use href="#slot" x="280" y="112"/><use href="#slot" x="336" y="112"/>
        <use href="#slot" y="168"/><use href="#slot" x="56" y="168"/><use href="#slot" x="112" y="168"/><use href="#slot" x="168" y="168"/><use href="#slot" x="224" y="168"/><use href="#slot" x="280" y="168"/><use href="#slot" x="336" y="168"/>
        <use href="#slot" y="224"/><use href="#slot" x="56" y="224"/><use href="#slot" x="112" y="224"/><use href="#slot" x="168" y="224"/><use href="#slot" x="224" y="224"/><use href="#slot" x="280" y="224"/><use href="#slot" x="336" y="224"/>
        <use href="#slot" y="280"/><use href="#slot" x="56" y="280"/><use href="#slot" x="112" y="280"/><use href="#slot" x="168" y="280"/><use href="#slot" x="224" y="280"/><use href="#slot" x="280" y="280"/><use href="#slot" x="336" y="280"/>
      </g>

      <!-- discs -->
      <g>
        <use href="#disc-yellow" transform="translate(270 102)"/>
        <use href="#disc-yellow" transform="translate(326 102)"/>
        <use href="#disc-yellow" transform="translate(382 102)"/>
        <use href="#disc-yellow" transform="translate(326 158)"/>
        <use href="#disc-yellow" transform="translate(382 158)"/>
        <use href="#disc-red" transform="translate(158 214)"/>
        <use href="#disc-red" transform="translate(102 270)"/>
        <use href="#disc-red" transform="translate(158 270)"/>
        <use href="#disc-red" transform="translate(214 270)"/>
        <use href="#disc-red" transform="translate(270 270)"/>
      </g>
    </g>
  </g>
</svg>
